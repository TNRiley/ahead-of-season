<title>Ahead of Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F0F3F2; --surface:#FFFFFF; --surface-2:#E8EDEB; --ink:#16211F; --muted:#5C6A67;
  --line:#D6DEDB; --line-strong:#BCC7C3;
  --accent:#B06A22; --accent-soft:#F2E2D0;
  --cold:#3D6E8F; --mid:#9AA3A0; --warm:#C4732A;
  --ctrl:#2E7D6B;
  --shadow:0 1px 2px rgba(22,33,31,.06),0 8px 24px -16px rgba(22,33,31,.28);
  --r:4px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1614; --surface:#17201E; --surface-2:#1E2825; --ink:#E6EDEA; --muted:#93A29E;
    --line:#26312E; --line-strong:#37443F;
    --accent:#E0913F; --accent-soft:#3A2A17;
    --cold:#6FA3C4; --mid:#8B9895; --warm:#E0913F;
    --ctrl:#5CBFA6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#17201E; --surface-2:#1E2825; --ink:#E6EDEA; --muted:#93A29E;
  --line:#26312E; --line-strong:#37443F;
  --accent:#E0913F; --accent-soft:#3A2A17;
  --cold:#6FA3C4; --mid:#8B9895; --warm:#E0913F;
  --ctrl:#5CBFA6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
.page{max-width:1720px;margin:0 auto;padding:28px 32px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;text-wrap:balance;margin:0;font-weight:600}
h1{font-size:44px;line-height:1.04;letter-spacing:-.015em;font-weight:700}
h2{font-size:21px;line-height:1.2}
h3{font-size:15px;line-height:1.3}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---------- header ---------- */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:20px}
.title-wrap{max-width:820px;display:flex;flex-direction:column;gap:12px}
.lede{font-size:16.5px;color:var(--muted);max-width:66ch}
.lede b{color:var(--ink);font-weight:500}
.hdr-right{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12px;padding:5px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ---------- control rail ---------- */
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;display:grid;gap:18px;box-shadow:var(--shadow);
  grid-template-columns:minmax(300px,2.1fr) minmax(180px,1fr) minmax(230px,1.2fr) auto}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:var(--r);cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.is-control[aria-pressed="true"]{background:var(--ctrl);border-color:var(--ctrl);color:#fff}
.chip .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ctrl);
  margin-right:5px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.hint{font-size:12px;color:var(--muted);line-height:1.4}

/* ---------- main grid ---------- */
.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1.42fr) minmax(340px,1fr);align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:1fr}.rail{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.rail{grid-template-columns:1fr}.page{padding:20px 16px 56px}h1{font-size:32px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.readthis{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;max-width:70ch}
.right-col{display:flex;flex-direction:column;gap:22px;min-width:0}
.scroll{overflow-x:auto}
svg{display:block;max-width:100%}
svg text{font-family:"IBM Plex Mono",monospace}

/* ---------- stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.15}
.stat .k{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.verdict{font-size:13.5px;line-height:1.5;padding:11px 13px;border-radius:var(--r);
  background:var(--surface-2);border-left:3px solid var(--accent)}
.verdict.flat{border-left-color:var(--ctrl)}

/* ---------- control-species table ---------- */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;padding-right:0}
tr.self td{font-weight:600}
tr.is-control td:first-child{color:var(--ctrl)}
.bar{height:7px;border-radius:1px;display:block}

/* ---------- methods ---------- */
.methods{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:26px}
.method-grid{display:grid;gap:20px 28px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.method{display:flex;flex-direction:column;gap:7px;max-width:62ch}
.method h3{font-family:"IBM Plex Sans",sans-serif;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
.method p{font-size:13.5px;color:var(--muted);line-height:1.6}
.method p b{color:var(--ink);font-weight:500}
.plain{display:none;font-size:13px;line-height:1.55;color:var(--ink);background:var(--surface-2);
  padding:9px 11px;border-radius:var(--r)}
body.plain-on .plain{display:block}
.foot{font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .track{transition:transform .6s cubic-bezier(.4,0,.2,1)}
}
.track:hover .track-hit{fill:var(--surface-2);fill-opacity:.7}
</style>
